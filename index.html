<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #tapOverlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;" onclick="playVideo()">

    <!-- Overlay -->
    <div id="tapOverlay">Point at frame, volume up, tap to start!</div>

    <a-scene embedded arjs>

        <!-- 🎥 VIDEO ASSETS -->
        <a-assets>
            <!-- ORIGINAL (unchanged) -->
            <video id="vid" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>

            <!-- NEW VIDEOS -->
            <video id="vid2" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
            <video id="vid3" src="Poster3.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
        </a-assets>

        <!-- 🖼️ ORIGINAL MARKER (UNCHANGED) -->
        <a-marker type="pattern" url="pattern-appicon.patt" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">

            <a-video src="#vid" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <!-- 🖼️ NEW MARKER 2 -->
        <a-marker type="pattern" url="pattern-riley_icon.patt" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">

            <a-video src="#vid2" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <!-- 🖼️ NEW MARKER 3 -->
        <a-marker type="pattern" url="pattern-poster3.patt" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">

            <a-video src="#vid3" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <!-- Camera -->
        <a-entity camera></a-entity>

    </a-scene>

    <!-- 🎯 INTERACTION SCRIPT -->
    <script>
        function playVideo() {
            const videos = document.querySelectorAll("video");
            const overlay = document.querySelector("#tapOverlay");

            videos.forEach(video => {
                video.muted = false;

                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            // fade out overlay once
            if (overlay.style.display !== "none") {
                overlay.style.transition = "opacity 0.4s";
                overlay.style.opacity = "0";
                setTimeout(() => overlay.style.display = "none", 400);
            }
        }
    </script>

</body>

</html>
