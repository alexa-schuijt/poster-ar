<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #tapOverlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;" onclick="playVideo()">
    <div id="tapOverlay">Point at frame, tap to start</div>
    <a-scene embedded arjs>

        <!-- Video asset -->
        <a-assets>
            <video id="vid" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous">
            </video>
        </a-assets>

        <!-- Marker -->
        <a-marker type="pattern" url="pattern-appicon.patt" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">
            <a-text value="Tap to start" position="0 1 0" align="center" color="white" width="4" id="tapText">
            </a-text>
            <!-- Video plane (upright + slightly forward) -->
            <a-video src="#vid" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- JS (waits until everything is loaded) -->
    <script>


        function playVideo() {
            const video = document.querySelector("#vid");
            const overlay = document.querySelector("#tapOverlay");

            video.muted = false;
            video.play();

            overlay.style.display = "none"; // hide text
        }


        function playVideo() {
            const video = document.querySelector("#vid");

            if (video.paused) {
                video.muted = false;   // enable sound
                video.play();
            } else {
                video.pause();         // stop video
            }
        }
    </script>

</body>

</html>
