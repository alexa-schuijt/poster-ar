<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;" onclick="playVideo()">

    <a-scene embedded arjs>

        <!-- Video asset -->
        <a-assets>
            <video id="vid" src="GrokVideo-2026-04-06.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous">
            </video>
        </a-assets>

        <!-- Marker -->
        <a-marker type="pattern" url="pattern-appicon.patt">

            <!-- Video plane (upright + slightly forward) -->
            <a-video src="#vid" position="20 20 0.01" rotation="-90 0 0" width="2" height="1.125">
            </a-video>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- JS (waits until everything is loaded) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const marker = document.querySelector("a-marker");
            const video = document.querySelector("#vid");

            // Play when marker is detected
            marker.addEventListener("markerFound", () => {
                if (video.paused) {
                    video.play().catch(e => console.log("Video blocked:", e));
                }
            });
        });

        // Fallback: play on tap
        function playVideo() {
            const video = document.querySelector("#vid");
            video.play();
        }
    </script>

</body>

</html>
