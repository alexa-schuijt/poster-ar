<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;" onclick="playVideo()">

    <a-scene embedded arjs>

        <!-- Video asset -->
        <a-assets>
            <video id="vid" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous">
            </video>
        </a-assets>

        <!-- Marker -->
        <a-marker type="pattern" url="pattern-appicon.patt" smooth="true" smoothCount="10" smoothTolerance="0.01"
            smoothThreshold="5">
            <a-text value="Tap to start" position="0 1 0" align="center" color="white" width="4" id="tapText">
            </a-text>
            <!-- Video plane (upright + slightly forward) -->
            <a-video src="#vid" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- JS (waits until everything is loaded) -->
    <script>


        document.addEventListener("DOMContentLoaded", function () {
            const marker = document.querySelector("a-marker");
            const text = document.querySelector("#tapText");

            marker.addEventListener("markerFound", () => {
                text.setAttribute("visible", true);

                setTimeout(() => {
                    text.setAttribute("visible", false);
                }, 6000); // disappears after 6 seconds
            });
        });


        function playVideo() {
            const video = document.querySelector("#vid");

            if (video.paused) {
                video.muted = false;   // enable sound
                video.play();
            } else {
                video.pause();         // stop video
            }
        }
    </script>

</body>

</html>
