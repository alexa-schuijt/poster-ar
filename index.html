<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        #tapOverlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            z-index: 999;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;" onclick="playVideo()">

    <!-- Overlay -->
    <div id="tapOverlay">Point at frame, volume up, tap to start!</div>

    <a-scene embedded arjs>

        <!-- 🎥 VIDEO ASSETS -->
        <a-assets>
            <!-- ORIGINAL (unchanged) -->
            <video id="vid" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>

            <!-- NEW VIDEOS -->
            <video id="vid2" src="KyleesAR.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
            <video id="vid3" src="Poster3.mp4" loop muted playsinline webkit-playsinline
                crossorigin="anonymous"></video>
        </a-assets>

        <!-- 🖼️ ORIGINAL MARKER (UNCHANGED) -->
        <!-- 🖼️ ORIGINAL MARKER -->
        <a-marker id="marker1" type="pattern" url="pattern-appicon.patt" smooth="true" smoothCount="10"
            smoothTolerance="0.01" smoothThreshold="5">

            <a-video src="#vid" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>

        <!-- 🖼️ MARKER 2 -->
        <a-marker id="marker2" type="pattern" url="pattern-tryingpattern.patt">

            <a-box position="0 0.5 0" material="color: blue;">
            </a-box>

        </a-marker>

        <!-- 🖼️ MARKER 3 -->
        <a-marker id="marker3" type="pattern" url="pattern-poster3.patt" smooth="true" smoothCount="10"
            smoothTolerance="0.01" smoothThreshold="5">

            <a-video src="#vid3" position="0 4 0.01" rotation="-90 0 0" width="6" height="3.4">
            </a-video>

        </a-marker>
        <!-- Camera -->
        <a-entity camera></a-entity>

    </a-scene>

    <!-- 🎯 INTERACTION SCRIPT -->
    <script>

        let activeVideo = null;

        function playVideo() {

            const overlay = document.querySelector("#tapOverlay");

            // figure out which marker is visible
            const marker1 = document.querySelector("#marker1");
            const marker2 = document.querySelector("#marker2");
            const marker3 = document.querySelector("#marker3");

            if (marker1.object3D.visible) {
                activeVideo = document.querySelector("#vid");
            }
            else if (marker2.object3D.visible) {
                activeVideo = document.querySelector("#vid2");
            }
            else if (marker3.object3D.visible) {
                activeVideo = document.querySelector("#vid3");
            }

            // if no marker visible, do nothing
            if (!activeVideo) return;

            // toggle play/pause
            if (activeVideo.paused) {

                activeVideo.muted = false;

                activeVideo.play();

            } else {

                activeVideo.pause();

            }

            // hide overlay
            if (overlay.style.display !== "none") {

                overlay.style.transition = "opacity 0.4s";
                overlay.style.opacity = "0";

                setTimeout(() => {
                    overlay.style.display = "none";
                }, 400);
            }
        }

    </script>

</body>

</html>
