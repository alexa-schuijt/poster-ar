<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<script>
    const marker = document.querySelector("a-marker");
    const video = document.querySelector("#vid");

    marker.addEventListener("markerFound", () => {
        video.play().catch(err => {
            console.log("Video play blocked, waiting for interaction:", err);
        });
    });
</script>

<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs>

        <a-assets>
            <video id="vid" src="shoppinglol.mp4" loop muted playsinline webkit-playsinline>
            </video>
        </a-assets>

        <a-marker type="pattern" url="kylee_try1-02.patt">
            <a-video src="#vid" width="1.5" height="1" position="0 0.5 0" rotation="-90 0 0">
            </a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
