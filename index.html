<!DOCTYPE html>
<html>

<head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;" onclick="document.querySelector('#vid').play()">

    <a-scene embedded arjs>

        <a-assets>
            <!-- Do NOT use autoplay here -->
            <video id="vid" src="shoppinglol.mp4" loop muted playsinline webkit-playsinline></video>
        </a-assets>

        <a-marker type="pattern" url="kylee_try1-02.patt">
            <!-- Video plane -->
            <a-video src="#vid" position="0 0 0" rotation="0 0 0" width="1.5" height="1"></a-video>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const marker = document.querySelector("a-marker");
        const video = document.querySelector("#vid");

        // Play the video when the marker is detected
        marker.addEventListener("markerFound", () => {
            if (video.paused) {
                video.play().catch(e => console.log("Video play blocked:", e));
            }
        });
    </script>

</body>

</html>
